<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판교 더 서바이벌: 바이브 코딩 네크로맨서의 강림</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="titleScreen">
    <h1>판교 더 서바이벌</h1>
    <h2>바이브 코딩 네크로맨서의 강림</h2>
    <p class="lore">"손코딩? 물리타격은 젊은 놈들이나 하는 거고."<br>
    부동산 7년, 자전거 장사 7년의 야인 <b>덕산</b>이<br>
    AI 바이브 코딩 흑마법을 깨우치고 판교역 3번 출구에 강림한다.</p>
    <div class="keys">
      <div><kbd>W A S D</kbd> 이동</div>
      <div><kbd>1</kbd> AG 골렘 소환 (탱커)</div>
      <div><kbd>2</kbd> CG 스켈레톤 워리어 (물리딜)</div>
      <div><kbd>3</kbd> GG 스켈레톤 메이지 (무결성 드릴)</div>
      <div><kbd>Space</kbd> 서브에이전트 웨이브 소환 (캡 16)</div>
      <div><kbd>E</kbd> 키보드 폭발 (시체 폭발)</div>
      <div><kbd>R</kbd> 궁극기: PASS 선언</div>
    </div>
    <button id="startBtn">판교역 3번 출구로 강림</button>
  </div>
  <div id="gameOverScreen" class="hidden">
    <h1 id="goTitle">YOU DIED</h1>
    <p id="goDesc">덕산은 다시 부동산으로 돌아갔다...</p>
    <button id="retryBtn">재강림 (다시 시작)</button>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
